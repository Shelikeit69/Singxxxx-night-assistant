<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>After-Hours Lock Assistant (prototype)</title>
<style>
:root{
  --bg:#f4f2ee; --panel:#ffffff; --ink:#1d2328; --muted:#66707a; --line:#e2ded6;
  --accent:#0f6b5c; --accent-soft:#e3f1ee; --bot:#ffffff; --me:#d9f0e6;
  --warn:#9a5b00; --warn-soft:#fff3dc; --chatbg:#ece7df; --mock:#7a3fa0; --mock-soft:#f3e9fa;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15191c; --panel:#1e2428; --ink:#e7eaec; --muted:#9aa4ad; --line:#30383e;
    --accent:#4fbfa8; --accent-soft:#18332e; --bot:#262d32; --me:#1d4038;
    --warn:#f0b450; --warn-soft:#3a2d14; --chatbg:#11161a; --mock:#c99be8; --mock-soft:#2c2036;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.banner{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line);padding:10px 16px;font-size:13px;text-align:center}
.banner b{font-weight:700}
header{max-width:1180px;margin:0 auto;padding:22px 16px 6px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lang.big button{font-size:14px;padding:6px 14px}
.sub{color:var(--muted);margin:0}
.scen{max-width:1180px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
.scen button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:14px}
.scen button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{max-width:1180px;margin:14px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.phone-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.phone-head .t{font-weight:600}
.phone-head .s{font-size:12px;color:var(--muted)}
.chat{background:var(--chatbg);height:520px;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 0 rgba(0,0,0,.06);font-size:14.5px}
.msg.cust{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;box-shadow:none;padding:2px}
.msg .time{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:3px}
.msg .tag{display:inline-block;font-size:11px;font-weight:600;color:var(--mock);background:var(--mock-soft);border-radius:4px;padding:0 5px;margin-left:4px}
.typing{align-self:flex-start;background:var(--bot);padding:8px 12px;border-radius:12px;color:var(--muted);font-size:13px}
.inputbar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.inputbar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:14px}
.inputbar button{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:0 16px;font-weight:600;cursor:pointer}
.hint{font-size:12px;color:var(--muted);padding:0 12px 10px}
.faq{padding:10px 10px 4px;border-top:1px solid var(--line)}
.faq .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.faq .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lang button{border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px;padding:3px 9px;cursor:pointer}
.lang button:first-child{border-radius:999px 0 0 999px}.lang button:last-child{border-radius:0 999px 999px 0;border-left:0}
.lang button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.msg .meta{display:block;font-size:11px;color:var(--muted);margin-top:5px;border-top:1px dashed var(--line);padding-top:4px}
.msg .meta.hand{color:var(--warn)}
.tally{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.tally div{flex:1;background:var(--bg);border-radius:10px;padding:8px 10px}
.tally b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.tally span{color:var(--muted);font-size:12px}
.side h2{font-size:15px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}
.pill.urgent{background:var(--warn-soft);color:var(--warn)}
.ticket{padding:4px 14px 14px}
.row{display:grid;grid-template-columns:132px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted)}
.row .v.empty{color:var(--muted);font-style:italic}
.row .v.flash{animation:fl 1.2s ease}
@keyframes fl{0%{background:var(--accent-soft)}100%{background:transparent}}
.stock{margin:0 14px 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stock .h{font-size:12.5px;font-weight:600;padding:8px 10px;background:var(--mock-soft);color:var(--mock)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 10px;text-align:left;border-top:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.hit td{background:var(--accent-soft)}
section.wide{max-width:1180px;margin:0 auto 16px;padding:0 16px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.phase{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.phase .no{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.phase h3{margin:4px 0 6px;font-size:16px}
.phase p,.phase li{font-size:13.5px;color:var(--muted);margin:0}
.phase ul{padding-left:18px;margin:6px 0 0}
h2.sec{font-size:18px;margin:22px 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13.5px}
.box ol,.box ul{margin:6px 0 0;padding-left:20px}
.box li{margin:3px 0}
footer{max-width:1180px;margin:0 auto 30px;padding:0 16px;color:var(--muted);font-size:12px}
</style>
</head>
<body>

<div class="banner" data-i18n="banner"></div>

<header>
  <div class="hd"><h1 data-i18n="title"></h1><span class="lang big" id="langTop"><button data-l="en">EN</button><button data-l="zh">中文</button></span></div>
  <p class="sub" data-i18n="sub"></p>
</header>

<div class="scen" id="scen">
  <button data-s="bto" class="on" data-i18n="sc1"></button>
  <button data-s="battery" data-i18n="sc2"></button>
  <button data-s="limits" data-i18n="sc3"></button>
  <button id="replay" style="margin-left:auto" data-i18n="replay"></button>
</div>

<div class="grid">
  <div class="card">
    <div class="phone-head">
      <div class="avatar">SX</div>
      <div><div class="t" data-i18n="botName"></div><div class="s" data-i18n="botSub"></div></div>
    </div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="faq">
      <div class="top"><span class="lbl" data-i18n="faqLbl"></span></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="inputbar">
      <input id="q" autocomplete="off">
      <button id="send" data-i18n="send"></button>
    </div>
    <div class="hint" data-i18n="hint"></div>
  </div>

  <div class="card side">
    <div class="tally"><div><b id="nAns">0</b><span data-i18n="tAns"></span></div><div><b id="nHand">0</b><span data-i18n="tHand"></span></div></div>
    <h2><span data-i18n="ticketH"></span> <span class="pill" id="prio"></span></h2>
    <div class="ticket" id="ticket"></div>
    <div class="stock">
      <div class="h" data-i18n="stockH"></div>
      <table>
        <thead><tr><th data-i18n="thModel"></th><th data-i18n="thType"></th><th class="n" data-i18n="thPrice"></th><th class="n" data-i18n="thUnits"></th></tr></thead>
        <tbody id="stock"></tbody>
      </table>
    </div>
  </div>
</div>

<section class="wide">
  <h2 class="sec" data-i18n="planH"></h2>
  <div class="cols">
    <div class="phase"><div class="no" data-i18n="p1no"></div><h3 data-i18n="p1h"></h3><ul data-i18n="p1ul"></ul></div>
    <div class="phase"><div class="no" data-i18n="p2no"></div><h3 data-i18n="p2h"></h3><ul data-i18n="p2ul"></ul></div>
    <div class="phase"><div class="no" data-i18n="p3no"></div><h3 data-i18n="p3h"></h3><ul data-i18n="p3ul"></ul></div>
  </div>
  <div class="two" style="margin-top:12px">
    <div class="box"><b data-i18n="qH"></b><ol data-i18n="qOl"></ol></div>
    <div class="box"><b data-i18n="rH"></b><ul data-i18n="rUl"></ul></div>
  </div>
</section>

<footer data-i18n="footer"></footer>

      say:{en:'About 2 hours for a wooden door lock and about 1 hour for a metal gate lock. Installations run Mon to Sat, 9:30am to 6pm.', zh:'木门锁大约 2 小时，铁闸锁大约 1 小时。安装时间是周一至周六 9:30 到 18:00。'}},
    {id:'warranty', re:/warrant|guarantee|保修|质保/, src:'FAQ: warranty', src_zh:'FAQ：保修',
      say:{en:'2-year local on-site warranty covering functional defects (parts and labour). Cosmetic wear and misuse are not covered.', zh:'2 年本地上门保修，涵盖功能故障（零件和人工）。外观磨损和使用不当不在保修范围内。'}},
    {id:'card', re:/lost.*card|card.*lost|lost.*tag|卡丢|门卡|丢了.*卡/, src:'FAQ: lost access card', src_zh:'FAQ：门卡丢失',
      say:{en:'Open the admin menu on the lock and delete that user ID, and the card stops working at once. Tip: write the user ID on each card when you set it up.', zh:'在门锁的管理菜单里删除这张卡对应的用户编号，卡就立即失效了。小建议：设置时把用户编号写在卡上。'}},
    {id:'finger', re:/fingerprint|指纹/, src:'FAQ: fingerprint troubleshooting', src_zh:'FAQ：指纹识别问题',
      say:{en:'Fingerprint reading can be affected by moisture, oil or angle. Wipe the finger and sensor, register the same finger at a few angles, and add a backup finger.', zh:'指纹识别会受潮湿、油污和角度影响。擦干手指和感应区，同一根手指多录几个角度，再加录一根备用手指。'}},
    {id:'battery', re:/batter|charge|电池|充电|续航/, src:'FAQ: battery', src_zh:'FAQ：电池',
      say:{en:'Most models use a rechargeable lithium battery that lasts a few months depending on use, with a low-battery alert. If it runs flat, a power bank on the emergency port wakes the lock up.', zh:'多数型号用可充电锂电池，按使用频率一般能用几个月，没电前会提醒。万一没电，用充电宝接应急供电口就能唤醒。'}},
    {id:'rain', re:/rain|water|weather|下雨|防水|淋雨/, src:'FAQ: water resistance', src_zh:'FAQ：防水',
      say:{en:'Yes, the locks are water-resistant for daily use and light rain at a typical entrance. For an exposed gate, the weatherproof gate model GL-C is the better fit.', zh:'可以，门锁有日常防水，挡得住一般走廊的小雨。如果铁闸完全露天，建议选防水款 GL-C。'}},
    {id:'forgot', re:/forg[eo]t to lock|left.*unlock|忘记锁|没锁/, src:'FAQ: auto-lock', src_zh:'FAQ：自动上锁',
      say:{en:'The handle stays locked unless someone is verified by fingerprint, PIN, card or app, so the door can\'t simply be opened from outside.', zh:'没有验证指纹、密码、门卡或 App 时，外面的把手是锁住的，别人不能直接开门。'}},
    {id:'app', re:/\bapp\b|wifi|wi-fi|remote|phone|手机|远程/, src:'Product list: app features', src_zh:'产品表：App 功能',
      say:{en:'Most models support remote unlocking and live view through the app. Note the app needs a 2.4GHz Wi-Fi connection.', zh:'多数型号支持 App 远程开锁和实时查看。注意 App 需要连接 2.4GHz 的 Wi-Fi。'}},
    {id:'payment', re:/deposit|reserve|pay|payment|定金|付款|订金|分期/, src:'FAQ: deposit and payment', src_zh:'FAQ：定金与付款',
      say:{en:'You can reserve a lock or a promo deal with a $100 deposit per lock. Paying after installation can be arranged on request, subject to terms.', zh:'可以付 $100 定金（每把锁）锁定型号或优惠。装完再付款也可以申请，需按条款确认。'}},

      say:{en:'Please be home at the agreed time. If the installation can\'t go ahead because no one is there, a $50 trip charge applies. To reschedule, just tell us in advance.', zh:'请在约定时间在家。如果因为没人在家无法安装，会收 $50 空跑费。需要改期请提前告诉我们。'}},
    {id:'showroom', re:/showroom|visit|address|where are you|展厅|门店|地址|看实物/, src:'Contact page', src_zh:'联系页面',
      say:{en:'We have two showrooms, one in the east and one in the west. I\'ll ask a colleague to send the address and opening hours.', zh:'我们东区和西区各有一个展厅。我请同事把地址和营业时间发给您。'}},
    {id:'face', re:/face|palm|facial|人脸|刷脸|掌静脉/, src:'Product list: face recognition models', src_zh:'产品表：人脸识别款',
      say:{en:'Face recognition door locks: DL-A ($880), DL-B ($800), DL-C ($780), DL-D ($760). For the gate: GL-A ($660) or GL-B ($700). Prices are illustrative.', zh:'带人脸识别的门锁：DL-A（$880）、DL-B（$800）、DL-C（$780）、DL-D（$760）。铁闸可选 GL-A（$660）或 GL-B（$700）。价格为示例。'}},
    {id:'price', re:/price|cost|how much|多少钱|价格|价钱/, src:'Product list: price range', src_zh:'产品表：价格区间',
      say:{en:'Single locks range from $500 (DL-F) to $880 (DL-A), and door + gate bundles from $900 to $1,200 (illustrative prices). Tell me your budget and I\'ll shortlist.', zh:'单把锁从 $500（DL-F）到 $880（DL-A），门锁 + 闸锁套装从 $900 到 $1,200（示例价格）。告诉我预算，我帮您挑。'}}
  ];
  function reply(q){
    var s=q.toLowerCase(), zh=isZh(q);
    for(var i=0;i<INTENTS.length;i++){
      var it=INTENTS[i];
      var hit = it.test ? it.test(s,q) : it.re.test(s);
      if(!hit) continue;
      if(it.product){
        var p=findProduct(q), u=MOCK_UNITS[p.m], d=zh?ZH_DESC[p.m]:p.desc;
        return {it:it, stock:[p.m], text: zh
          ? p.m+'（'+(p.type==='Door'?'门锁':'闸锁')+'）：'+d+'。示例价 $'+p.price+'，含标准安装和 2 年上门保修。\n库存：'+stockWord(u,true)+'。'
          : p.m+' ('+p.type.toLowerCase()+' lock): '+d+'. Illustrative price $'+p.price+', including standard installation and a 2-year on-site warranty.\nStock: '+stockWord(u,false)+'.'};
      }
      if(it.budget){
        var b=budgetOf(q), fit=BUNDLES.filter(function(x){return x.price<=b;}).sort(function(x,y){return y.price-x.price;}).slice(0,3);
        if(!fit.length) return {it:it, text: zh ? '预算 '+fmt(b)+' 以内暂时没有门锁 + 闸锁套装，单把锁最低 $500（DL-F）。要不要先看单锁？' : 'There\'s no door + gate bundle within '+fmt(b)+'; single locks start at $500 (DL-F). Shall I list single locks?'};
        var list=fit.map(function(x){return '• '+x.name+(zh?'：':': ')+fmt(x.price)+(outOf(x.name)?(zh?'（暂时缺货）':' (out of stock)'):'');}).join('\n');
        var ids=[]; fit.forEach(function(x){x.name.split(' + ').forEach(function(m){if(ids.indexOf(m)<0)ids.push(m);});});
        return {it:it, stock:ids, tk:{interest:(lang==='zh'?'预算 '+fmt(b)+' 以内套装：':'Bundle within '+fmt(b)+': ')+fit.map(function(x){return x.name;}).join(', ')}, text: zh
          ? '预算 '+fmt(b)+' 以内的门锁 + 闸锁套装（示例价格）：\n'+list+'\n是木门加铁闸吗？方便的话发一下邮编和门的照片，我帮同事先准备好。'
          : 'Door + gate bundles within '+fmt(b)+' (illustrative prices):\n'+list+'\nIs it a wooden door with a metal gate? Send your postal code and a photo and I\'ll prepare it for the team.'};
      }
      return {it:it, text: zh ? it.say.zh : it.say.en};
    }
    return {it:{id:'unknown', hand:'Question not in FAQ', hand_zh:'FAQ 未覆盖的问题', src:'Not found in FAQ', src_zh:'FAQ 中未找到'}, text: zh ? '这个问题我还不确定，已经记下来转给同事，'+NEXT.zh : 'I\'m not sure about that one, so I\'ve noted it for the team. '+NEXT.en};
  }
  function updateTally(){ document.getElementById('nAns').textContent=nAns; document.getElementById('nHand').textContent=nHand; }
  function startLive(){
    if(liveMode) return; liveMode=true; chat.innerHTML=''; renderTicket(); renderStock();
    add('sys', t('liveSys'));
    setField('type', t('liveType')); setField('received', t('now'));
    setPrio(T.en.waiting, T.zh.waiting, false);
    document.querySelectorAll('#scen button[data-s]').forEach(function(x){x.classList.remove('on');});
  }
  function ask(q){
    q=String(q||'').trim(); if(!q) return;
    clearTimers(); startLive(); add('cust',q,t('now'));
    var r=reply(q);
    typing(true);
    timers.push(setTimeout(function(){
      typing(false);
      if(r.stock) renderStock(r.stock);
      var meta, zhUI = lang==='zh';
      if(r.it.hand){
        nHand++; var why = zhUI ? (r.it.hand_zh||r.it.hand) : r.it.hand;
        meta = t('handed') + why;
        setField('next', why+(zhUI?'：“':': "')+q+(zhUI?'”':'"'));
        if(r.tk&&r.tk.interest) setField('interest', r.tk.interest);
        if(r.it.urgent) setPrio(T.en.urgent, T.zh.urgent, true); else setPrio(T.en.needPerson, T.zh.needPerson, false);
      } else {
        nAns++; meta = t('answered') + (zhUI ? (r.it.src_zh||r.it.src) : r.it.src);
        if(r.tk) Object.keys(r.tk).forEach(function(k){setField(k,r.tk[k]);});
        if(r.stock) setField('stock', r.stock.map(function(m){return m+(MOCK_UNITS[m]>0?' ✓':t('out'));}).join(' · ')+t('mockData'));
      }
      add('bot', r.text, t('now'), !!r.stock, meta, !!r.it.hand);
      updateTally();
    },700));
  }
  function send(){ var inp=document.getElementById('q'); ask(inp.value); inp.value=''; }
  function renderChips(){
    var box=document.getElementById('chips'); box.innerHTML='';
    CHIPS[lang].forEach(function(txt){ var b=document.createElement('button'); b.type='button'; b.textContent=txt; b.onclick=function(){ask(txt);}; box.appendChild(b); });
  }
  function setLang(l){
    if(l===lang) return; lang=l; applyLang();
    try{ history.replaceState(null,'', l==='zh' ? '?lang=zh' : location.pathname); }catch(e){}
    if(!liveMode){
      document.querySelectorAll('#scen button[data-s]').forEach(function(x){x.classList.toggle('on', x.dataset.s===current);});
      play(current);
    }
  }
  document.querySelectorAll('#langTop button').forEach(function(b){ b.onclick=function(){ setLang(b.dataset.l); }; });
  document.getElementById('send').onclick=send;
  document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter')send();});
  document.querySelectorAll('#scen button[data-s]').forEach(function(b){
    b.onclick=function(){document.querySelectorAll('#scen button[data-s]').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); play(b.dataset.s);};
  });
  document.getElementById('replay').onclick=function(){ document.querySelectorAll('#scen button[data-s]').forEach(function(x){x.classList.toggle('on', x.dataset.s===current);}); play(current);};
  renderTicket(); applyLang();
  play('bto');
})();
</script>
